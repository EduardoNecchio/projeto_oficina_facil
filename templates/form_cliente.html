{% extends "base.html" %}
{% block title %}{{ 'Editar' if cliente else 'Novo' }} cliente | Oficina Fácil{% endblock %}
{% block content %}
<section class="panel narrow"><a class="back" href="{{ url_for('detalhe_cliente', id_cliente=cliente.id_cliente) if cliente else url_for('clientes') }}">← Voltar</a><span class="eyebrow">CADASTROS</span><h1>{{ 'Editar cliente' if cliente else 'Novo cliente' }}</h1>
<form method="post" class="form">
<label>Nome completo<input name="nome" required maxlength="120" value="{{ valores.get('nome', cliente.nome if cliente else '') }}"></label>
<label>Telefone<input name="telefone" maxlength="30" value="{{ valores.get('telefone', cliente.telefone if cliente else '') }}" placeholder="(11) 99999-9999"></label>
<label>E-mail<input type="email" name="email" maxlength="120" value="{{ valores.get('email', cliente.email if cliente and cliente.email else '') }}"></label>
<div class="form-actions"><button class="button" type="submit">Salvar cliente</button><a class="button secondary" href="{{ url_for('clientes') }}">Cancelar</a></div>
</form></section>
{% endblock %}
